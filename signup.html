<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="js/boot.js"></script>
<title>회원가입 · 공무원 AI</title>
<meta name="theme-color" content="#1b2130" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎓</text></svg>" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/shell.css" />
<link rel="stylesheet" href="css/auth.css" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" /></noscript>
</head>
<body>
<a class="skip-link" href="#signupForm">회원가입으로 건너뛰기</a>

<header class="topbar">
  <a class="topbar__home" href="index.html">
    <span class="topbar__dot" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.4" /><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0" /></svg>
    </span>
    공무원 AI
  </a>
  <div class="topbar__spacer"></div>
  <div class="topbar__auth">
    <a class="topbar__btn topbar__btn--ghost" href="login.html">로그인</a>
    <a class="topbar__btn topbar__btn--primary" href="signup.html" aria-current="page">회원가입</a>
  </div>
</header>

<main class="auth">
  <section class="auth__card" aria-labelledby="signupTitle">
    <p class="auth__brand">
      <span class="auth__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M2.5 8.5 12 4.5l9.5 4-9.5 4-9.5-4Z" /><path d="M6.5 11v5.2c0 1.3 2.5 2.3 5.5 2.3s5.5-1 5.5-2.3V11" /></svg>
      </span>
      공무원 AI
    </p>
    <h1 class="auth__title" id="signupTitle">회원가입</h1>
    <p class="auth__sub">이름과 이메일만 있으면 바로 시작할 수 있습니다.</p>

    <form class="auth__form" id="signupForm">
      <label for="signupName">이름</label>
      <input class="field" id="signupName" name="name" type="text" autocomplete="name" required maxlength="20" placeholder="홍길동" />

      <label for="signupEmail">이메일</label>
      <input class="field" id="signupEmail" name="email" type="email" autocomplete="username" required placeholder="name@email.com" />

      <label for="signupPassword">비밀번호</label>
      <input class="field" id="signupPassword" name="password" type="password" autocomplete="new-password" required minlength="6" placeholder="6자 이상" />

      <label for="signupPasswordAgain">비밀번호 확인</label>
      <input class="field" id="signupPasswordAgain" name="passwordAgain" type="password" autocomplete="new-password" required minlength="6" />

      <button class="btn btn--primary auth__submit" type="submit">회원가입</button>
    </form>

    <p class="auth__foot">이미 계정이 있나요? <a href="login.html">로그인</a></p>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/shell.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
